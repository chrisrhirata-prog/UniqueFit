<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UniqueFit">
<title>UniqueFit</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#080808;--bg2:#0F0F0F;--bg3:#161616;--bg4:#1E1E1E;
  --border:#252525;--border2:#2E2E2E;--border3:#383838;
  --green:#1D9E75;--green2:#0F6E56;--green-dim:rgba(29,158,117,0.12);
  --amber:#EF9F27;--amber-dim:rgba(239,159,39,0.12);
  --coral:#D85A30;--coral-dim:rgba(216,90,48,0.12);
  --purple:#7F77DD;--purple-dim:rgba(127,119,221,0.12);
  --blue:#4A9EDB;--blue-dim:rgba(74,158,219,0.12);
  --text:#EDEAE2;--text2:#777770;--text3:#3E3E3A;
  --font-d:'Bebas Neue',sans-serif;--font-b:'DM Sans',sans-serif;--font-m:'DM Mono',monospace;
  --r:10px;--r2:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-b);}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 86px;scroll-behavior:smooth;}
.content::-webkit-scrollbar{display:none;}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,8,0.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 7px;cursor:pointer;border:none;background:none;color:var(--text3);font-family:var(--font-b);font-size:9px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;transition:color 0.2s;}
.nav-btn.active{color:var(--green);}
.nav-btn svg{width:21px;height:21px;}
.page-header{margin-bottom:18px;padding-top:2px;}
.page-title{font-family:var(--font-d);font-size:40px;letter-spacing:1.5px;line-height:1;}
.page-title span{color:var(--green);}
.page-sub{font-size:11px;color:var(--text2);margin-top:5px;font-family:var(--font-m);display:flex;align-items:center;gap:6px;}
.glow-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:10px;}
.card-title{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;font-family:var(--font-m);}
.metric-grid{display:grid;gap:7px;margin-bottom:10px;}
.mg-4{grid-template-columns:repeat(4,1fr);}
.mg-3{grid-template-columns:repeat(3,1fr);}
.mg-2{grid-template-columns:repeat(2,1fr);}
.metric{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:11px 10px;}
.metric-val{font-family:var(--font-d);font-size:24px;color:var(--text);letter-spacing:0.5px;line-height:1;}
.metric-val.green{color:var(--green);}
.metric-val.amber{color:var(--amber);}
.metric-val.coral{color:var(--coral);}
.metric-lbl{font-size:10px;color:var(--text2);margin-top:3px;font-family:var(--font-m);}
.prog-wrap{margin-bottom:10px;}
.prog-top{display:flex;justify-content:space-between;margin-bottom:5px;font-size:11px;color:var(--text2);font-family:var(--font-m);}
.prog-bg{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;background:var(--green);transition:width 0.5s cubic-bezier(0.4,0,0.2,1);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.form-row.three{grid-template-columns:1fr 1fr 1fr;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-size:10px;color:var(--text2);font-family:var(--font-m);letter-spacing:0.05em;}
.form-group input,.form-group select{height:40px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font-b);font-size:13px;padding:0 10px;width:100%;outline:none;transition:border-color 0.2s;-webkit-appearance:none;}
.form-group input:focus,.form-group select:focus{border-color:var(--green);}
.form-group select option{background:var(--bg3);}
.form-group input::placeholder{color:var(--text3);}
.btn{height:42px;border-radius:var(--r);border:none;font-family:var(--font-b);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;}
.btn-green{background:var(--green);color:#fff;}.btn-green:active{background:var(--green2);}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border2);}.btn-outline:active{border-color:var(--green);color:var(--green);}
.btn-sm{height:30px;font-size:11px;font-weight:600;border-radius:8px;padding:0 12px;width:auto;margin-top:0;}
.btn-ai{background:linear-gradient(135deg,#185FA5,var(--purple));color:#fff;}
.check-item{display:flex;align-items:center;gap:12px;padding:14px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;cursor:pointer;transition:all 0.15s;-webkit-user-select:none;user-select:none;min-height:58px;}
.check-item:active{transform:scale(0.985);opacity:0.9;}
.check-item.done{background:var(--green-dim);border-color:rgba(29,158,117,0.28);}
.check-box{width:24px;height:24px;border-radius:50%;border:2px solid var(--border3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.check-item.done .check-box{background:var(--green);border-color:var(--green);}
.check-tick{display:none;}.check-item.done .check-tick{display:block;}
.check-name{flex:1;font-size:14px;color:var(--text);line-height:1.3;}
.check-item.done .check-name{color:var(--green);text-decoration:line-through;}
.check-meta{font-size:12px;color:var(--text3);font-family:var(--font-m);white-space:nowrap;}
.check-item.done .check-meta{color:var(--green2);}
.section-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;margin:14px 0 7px;font-family:var(--font-m);position:sticky;top:0;background:var(--bg);padding:6px 0 4px;z-index:10;}
/* REST TIMER */
.timer-overlay{position:fixed;bottom:86px;left:0;right:0;z-index:200;display:flex;justify-content:center;pointer-events:none;}
.timer-pill{background:var(--bg2);border:1px solid var(--border2);border-radius:40px;padding:10px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,0.6);pointer-events:all;min-width:220px;}
.timer-ring{width:44px;height:44px;flex-shrink:0;transform:rotate(-90deg);}
.timer-circle-bg{fill:none;stroke:var(--border2);stroke-width:4;}
.timer-circle-fill{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke 0.3s;}
.timer-circle-fill.warn{stroke:var(--amber);}
.timer-circle-fill.done{stroke:var(--coral);}
.timer-info{flex:1;}
.timer-label{font-size:10px;color:var(--text2);font-family:var(--font-m);}
.timer-count{font-family:var(--font-d);font-size:28px;color:var(--text);letter-spacing:1px;line-height:1;}
.timer-close{width:28px;height:28px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
/* QUICK LOG MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;display:flex;align-items:flex-end;}
.modal-sheet{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;border-top:1px solid var(--border2);animation:slideUp 0.25s cubic-bezier(0.4,0,0.2,1);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
/* NAV — bigger labels */
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;cursor:pointer;border:none;background:none;color:var(--text3);font-family:var(--font-b);font-size:10px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;transition:color 0.2s;}
.nav-btn svg{width:22px;height:22px;}
/* WATER — bigger cups */
.water-cup{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--border3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all 0.2s;background:var(--bg3);}
.water-cup.filled{background:var(--blue-dim);border-color:var(--blue);transform:scale(1.05);}
/* CHECK ANIMATION */
@keyframes checkPop{0%{transform:scale(1);}40%{transform:scale(1.06);}100%{transform:scale(1);}}
.check-item.just-done{animation:checkPop 0.25s ease;}
/* SWAP MODAL */
.swap-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:400;display:flex;align-items:flex-end;}
.swap-modal-sheet{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;border-top:1px solid var(--border2);animation:slideUp 0.25s cubic-bezier(0.4,0,0.2,1);max-height:80vh;overflow-y:auto;}
/* STREAK BADGE */
.streak-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--amber-dim);border:1px solid rgba(239,159,39,0.25);border-radius:20px;font-size:11px;color:var(--amber);font-family:var(--font-m);font-weight:600;}
/* EMPTY STATE */
.empty-state{text-align:center;padding:32px 16px;}
.empty-state-icon{font-size:40px;margin-bottom:12px;}
.empty-state-title{font-family:var(--font-d);font-size:22px;color:var(--text);letter-spacing:1px;margin-bottom:8px;}
.empty-state-sub{font-size:13px;color:var(--text2);line-height:1.7;max-width:260px;margin:0 auto 16px;}
.day-tab{text-align:center;cursor:pointer;padding:7px 2px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);transition:all 0.15s;-webkit-user-select:none;user-select:none;}
.day-tab.active{background:var(--green);border-color:var(--green);}
.day-tab.complete{background:var(--green-dim);border-color:rgba(29,158,117,0.35);}
.day-tab .dt-l{font-size:9px;font-weight:700;color:var(--text2);font-family:var(--font-m);}
.day-tab .dt-s{font-size:8px;color:var(--text3);margin-top:1px;}
.day-tab.active .dt-l,.day-tab.active .dt-s{color:#fff;}
.day-tab.complete .dt-l{color:var(--green);}
.chip{padding:2px 8px;border-radius:20px;font-size:10px;font-family:var(--font-m);font-weight:500;}
.meal-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:8px;}
.meal-header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.meal-body{padding:0 14px 14px;}
.step-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.step-row:last-child{border-bottom:none;}
.step-num{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-text{font-size:12px;color:var(--text2);line-height:1.55;}
.log-table{width:100%;border-collapse:collapse;font-size:12px;}
.log-table th{text-align:left;padding:6px 8px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);font-family:var(--font-m);font-size:9px;text-transform:uppercase;letter-spacing:0.08em;}
.log-table td{padding:8px 8px;color:var(--text);border-bottom:1px solid var(--border);}
.log-table tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;font-family:var(--font-m);}
.badge-green{background:var(--green-dim);color:var(--green);}
.badge-amber{background:var(--amber-dim);color:var(--amber);}
.ai-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:5px;cursor:pointer;font-family:var(--font-b);font-size:13px;color:var(--text);width:100%;text-align:left;transition:all 0.15s;}
.ai-btn:active{border-color:var(--blue);}
.ai-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#185FA5,var(--purple));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-response{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:14px;font-size:13px;color:var(--text);line-height:1.75;margin-top:10px;white-space:pre-wrap;}
.typing-dots span{animation:blink 1.2s infinite;}.typing-dots span:nth-child(2){animation-delay:0.2s;}.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,80%,100%{opacity:0;}40%{opacity:1;}}
.rest-card{background:var(--bg3);border-radius:var(--r2);padding:28px;text-align:center;}
.rest-title{font-family:var(--font-d);font-size:26px;color:var(--text);letter-spacing:1px;margin-bottom:8px;}
.rest-sub{font-size:13px;color:var(--text2);line-height:1.7;}
.success-banner{background:var(--green-dim);border:1px solid rgba(29,158,117,0.3);border-radius:var(--r);padding:11px;text-align:center;font-size:13px;font-weight:600;color:var(--green);margin-bottom:10px;}
.rest-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-family:var(--font-m);background:var(--amber-dim);color:var(--amber);margin-left:6px;}
.swap-picker-enter{animation:fadeIn 0.15s ease;}
.plan-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.plan-row:last-child{border-bottom:none;}
.plan-label{color:var(--text2);font-family:var(--font-m);font-size:11px;}
.water-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.water-cup{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all 0.2s;background:var(--bg3);}
.water-cup.filled{background:var(--blue-dim);border-color:var(--blue);}
.empty{color:var(--text3);font-size:13px;text-align:center;padding:20px 0;font-family:var(--font-m);}
canvas{max-height:180px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.panel-inner{animation:fadeIn 0.22s ease;}
/* FLOATING WATER BUTTON */
.water-fab{position:fixed;bottom:96px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--bg2);border:2px solid var(--blue);color:var(--blue);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:150;box-shadow:0 4px 20px rgba(0,0,0,0.5);transition:all 0.2s;-webkit-user-select:none;user-select:none;}
.water-fab:active{transform:scale(0.9);}
.water-fab-count{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);}
/* OVER TARGET WARNING */
.over-target{background:rgba(216,90,48,0.12);border:1px solid rgba(216,90,48,0.3);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--coral);font-weight:600;}
/* EXERCISE NOTE */
.ex-note-input{width:100%;background:var(--bg4);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-family:var(--font-m);font-size:11px;padding:6px 10px;outline:none;margin-top:5px;transition:border-color 0.2s;}
.ex-note-input:focus{border-color:var(--green);color:var(--text);}
.ex-note-saved{font-size:10px;color:var(--green);font-family:var(--font-m);margin-top:3px;}
/* TODAY BUTTON */
.today-btn{height:32px;padding:0 14px;background:var(--amber-dim);border:1px solid rgba(239,159,39,0.3);border-radius:20px;color:var(--amber);font-family:var(--font-m);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.today-btn:active{background:var(--amber);color:#000;}
/* MEAL CHECKLIST */
.meal-check{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:5px;cursor:pointer;transition:all 0.15s;-webkit-user-select:none;user-select:none;}
.meal-check:active{transform:scale(0.98);}
.meal-check.done{background:var(--green-dim);border-color:rgba(29,158,117,0.28);}
.meal-check-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--border3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.meal-check.done .meal-check-box{background:var(--green);border-color:var(--green);}
.meal-check-tick{display:none;}.meal-check.done .meal-check-tick{display:block;}
.meal-check-name{font-size:13px;color:var(--text);}
.meal-check.done .meal-check-name{color:var(--green);text-decoration:line-through;}
.meal-check-sub{font-size:11px;color:var(--text3);font-family:var(--font-m);margin-top:2px;}
</style>
</head>
<body>
<div class="app">
  <div class="content" id="content"></div>
  <nav class="nav" id="nav"></nav>
</div>
<script>
const SK='ufit_v5';
let S={weights:[],macros:[],checklist:{},water:{},mealCheck:{}};
try{const r=localStorage.getItem(SK);if(r)S=Object.assign({weights:[],macros:[],checklist:{},water:{},mealCheck:{}},JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
function today(){return new Date().toLocaleDateString('en-CA');}
function weekKey(di){const now=new Date();const start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));const d=new Date(start);d.setDate(d.getDate()+di);return d.toLocaleDateString('en-CA');}
function fmtDate(d){return new Date(d+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}

const DAYS=[
  {label:'MON',sub:'Push',rest:false,focus:'Chest, Shoulders & Triceps',color:'#D85A30',duration:'80–90 min',sections:[
    {name:'Warm Up',items:[{n:'Treadmill walk warm-up',m:'5–10 min',rest:'—'}]},
    {name:'Lifting',items:[
      {n:'Barbell bench press',m:'4×6–8',rest:'90s',note:'Main compound — focus on form',alts:[
        {n:'Dumbbell bench press',m:'4×8–10',rest:'90s',note:'Better range of motion'},
        {n:'Smith machine bench press',m:'4×8–10',rest:'90s',note:'Good for stability'},
        {n:'Push-ups (weighted)',m:'4×12–15',rest:'75s',note:'Bodyweight + plate on back'},
      ]},
      {n:'Incline dumbbell press',m:'3×8–10',rest:'75s',note:'Control the eccentric',alts:[
        {n:'Incline barbell press',m:'3×8–10',rest:'75s',note:'Heavier load option'},
        {n:'Incline cable fly',m:'3×12–15',rest:'60s',note:'Constant tension on upper chest'},
      ]},
      {n:'Overhead dumbbell press',m:'3×8–10',rest:'75s',note:'Seated or standing',alts:[
        {n:'Barbell overhead press',m:'3×8–10',rest:'75s',note:'Standing — great for core too'},
        {n:'Arnold press',m:'3×10–12',rest:'75s',note:'Full shoulder rotation'},
        {n:'Landmine press',m:'3×10–12',rest:'75s',note:'Easier on shoulders'},
      ]},
      {n:'Cable lateral raise',m:'3×12–15',rest:'60s',note:'Light weight, strict form',alts:[
        {n:'Dumbbell lateral raise',m:'3×12–15',rest:'60s',note:'Slow and controlled'},
        {n:'Machine lateral raise',m:'3×15–20',rest:'45s',note:'Isolates medial delt'},
      ]},
      {n:'Cable tricep pushdown',m:'3×12–15',rest:'60s',note:'Rope attachment',alts:[
        {n:'Tricep kickbacks',m:'3×12–15',rest:'60s',note:'Dumbbell, hinge at hip'},
        {n:'Close-grip bench press',m:'3×10–12',rest:'75s',note:'Compound tricep builder'},
      ]},
      {n:'Overhead tricep extension',m:'3×10–12',rest:'60s',note:'Dumbbell or EZ bar',alts:[
        {n:'Skull crushers (EZ bar)',m:'3×10–12',rest:'60s',note:'Slow and controlled'},
        {n:'Tricep dips (bodyweight)',m:'3×10–15',rest:'60s',note:'Upright torso for triceps'},
      ]},

// ─── EXERCISE SWAP STATE ─────────────────────────────────────────
// swapKey: 'di_si_ii' → index of chosen alt (0 = original)
function swapKey(di,si,ii){return 'swap_'+di+'_'+si+'_'+ii;}

// ─── HAPTIC FEEDBACK ─────────────────────────────────────────────
function haptic(style){
  try{
    if(navigator.vibrate) navigator.vibrate(style==='medium'?25:style==='success'?[10,30,10]:10);
  }catch(e){}
}

// ─── EXERCISE NOTES ──────────────────────────────────────────────
function noteKey(di,si,ii){return 'note_'+di+'_'+si+'_'+ii;}
function getNote(di,si,ii){return S.checklist[noteKey(di,si,ii)]||'';}
function saveNote(di,si,ii){
  const el=document.getElementById('note_'+di+'_'+si+'_'+ii);
  if(!el)return;
  S.checklist[noteKey(di,si,ii)]=el.value;
  save();
  const badge=document.getElementById('notesaved_'+di+'_'+si+'_'+ii);
  if(badge){badge.style.opacity='1';setTimeout(()=>{badge.style.opacity='0';},1500);}
}

// ─── WEEKLY WORKOUT SUMMARY ──────────────────────────────────────
function getWeekSummary(){
  const labels=['MON','TUE','WED','THU','FRI','SAT','SUN'];
  return DAYS.map((day,di)=>{
    if(day.rest)return{label:labels[di],pct:0,done:0,total:0,rest:true,color:'var(--border3)'};
    const{done,total}=dayProg(di);
    return{label:labels[di],pct:total>0?Math.round(done/total*100):0,done,total,rest:false,color:day.color};
  });
}

// ─── FLOATING WATER FAB ──────────────────────────────────────────
function renderWaterFAB(){
  const w=waterCount();
  return'<div style="position:fixed;bottom:96px;right:16px;width:50px;height:50px;border-radius:50%;background:var(--bg2);border:2px solid '+(w>=8?'var(--green)':'var(--blue)')+';color:'+(w>=8?'var(--green)':'var(--blue)')+';font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:150;box-shadow:0 4px 20px rgba(0,0,0,0.5);-webkit-user-select:none;user-select:none;" onclick="'+(w<8?'toggleWater('+(w+1)+');haptic(\'light\');':'')+'renderContent();">'
    +'💧'
    +'<div style="position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:50%;background:'+(w>=8?'var(--green)':'var(--blue)')+';color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);">'+w+'</div>'
    +'</div>';
}

// ─── OVER CALORIE CHECK ───────────────────────────────────────────
function isOverTarget(){return getTotalCals()>1825&&getTotalCals()>0;}
function getSwap(di,si,ii){return S.checklist[swapKey(di,si,ii)]||0;} // 0=original
function setSwap(di,si,ii,altIdx){
  if(altIdx===0) delete S.checklist[swapKey(di,si,ii)];
  else S.checklist[swapKey(di,si,ii)]=altIdx;
  // clear completion when swapping
  delete S.checklist[ck(di,si,ii)];
  save();renderContent();
}
function getActiveExercise(di,si,ii){
  const base=DAYS[di].sections[si].items[ii];
  const altIdx=getSwap(di,si,ii);
  if(altIdx===0||!base.alts||altIdx>base.alts.length) return base;
  return {...base.alts[altIdx-1], alts:base.alts, isAlt:true, originalName:base.n};
}

// ─── WORKOUT SESSION LOGIC ────────────────────────────────────────
// Completions stored by 'session key' = dayIndex + date logged
// This lets you do any day's workout on any calendar day
function sessionDate(di){
  // Returns the date this day's workout was last started, or today if none
  return S.checklist['session_date_'+di]||null;
}
function ensureSessionDate(di){
  if(!S.checklist['session_date_'+di]){
    S.checklist['session_date_'+di]=today();
    save();
  }
}
function ck(di,si,ii){
  const sd=S.checklist['session_date_'+di]||today();
  return sd+'_'+di+'_'+si+'_'+ii;
}
function isDone(di,si,ii){return!!S.checklist[ck(di,si,ii)];}
function toggleEx(di,si,ii){
  ensureSessionDate(di);
  S.checklist[ck(di,si,ii)]=!S.checklist[ck(di,si,ii)];
  if(S.checklist[ck(di,si,ii)]) haptic('medium'); else haptic('light');
  save();renderContent();
}
function allDone(di){
  const d=DAYS[di];
  if(d.rest)return false;
  return d.sections.every((s,si)=>s.items.every((_,ii)=>isDone(di,si,ii)));
}
function dayProg(di){
  const d=DAYS[di];
  if(d.rest)return{done:0,total:0};
  let t=0,dn=0;
  d.sections.forEach((s,si)=>s.items.forEach((_,ii)=>{t++;if(isDone(di,si,ii))dn++;}));
  return{done:dn,total:t};
}
function setDay(i){activeDay=i;renderContent();}
function resetDay(){
  const day=DAYS[activeDay];
  if(day.rest)return;
  // Clear session date so it resets to today
  delete S.checklist['session_date_'+activeDay];
  const newKey=today();
  S.checklist['session_date_'+activeDay]=newKey;
  day.sections.forEach((s,si)=>s.items.forEach((_,ii)=>{
    delete S.checklist[ck(activeDay,si,ii)];
  }));
  save();renderContent();
}

// ─── REST TIMER ───────────────────────────────────────────────────
let timerInterval=null,timerTotal=0,timerLeft=0,timerLabel='Rest';
function parseRestSecs(restStr){
  if(!restStr||restStr==='—')return 0;
  const m=restStr.match(/(\d+)\s*min/);if(m)return parseInt(m[1])*60;
  const s=restStr.match(/(\d+)s/);if(s)return parseInt(s[1]);
  return 0;
}
function startTimer(secs,label){
  clearInterval(timerInterval);
  timerTotal=secs;timerLeft=secs;timerLabel=label;
  renderTimerOverlay();
  timerInterval=setInterval(()=>{
    timerLeft--;
    if(timerLeft<=0){clearInterval(timerInterval);timerLeft=0;try{new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA...').play();}catch(e){}}
    renderTimerOverlay();
  },1000);
}
function stopTimer(){clearInterval(timerInterval);timerLeft=0;timerTotal=0;const o=document.getElementById('timer-overlay');if(o)o.remove();}
function fmtTimer(s){return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');}
function renderTimerOverlay(){
  let o=document.getElementById('timer-overlay');
  if(!o){o=document.createElement('div');o.id='timer-overlay';o.className='timer-overlay';document.body.appendChild(o);}
  if(timerLeft<=0&&timerTotal===0){o.remove();return;}
  const pct=timerTotal>0?timerLeft/timerTotal:0;
  const circ=2*Math.PI*18;
  const offset=circ*(1-pct);
  const cls=timerLeft<=10?'done':timerLeft<=20?'warn':'';
  o.innerHTML=`<div class="timer-pill">
    <svg class="timer-ring" viewBox="0 0 44 44">
      <circle class="timer-circle-bg" cx="22" cy="22" r="18"/>
      <circle class="timer-circle-fill ${cls}" cx="22" cy="22" r="18" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="timer-info">
      <div class="timer-label">${timerLeft>0?'REST — '+timerLabel:'✓ REST DONE'}</div>
      <div class="timer-count" style="color:${timerLeft<=10?'var(--coral)':timerLeft<=20?'var(--amber)':'var(--text)'};">${fmtTimer(timerLeft)}</div>
    </div>
    <button class="timer-close" onclick="stopTimer()">✕</button>
  </div>`;
}

// ─── STREAK ───────────────────────────────────────────────────────
function calcStreak(){
  let streak=0;
  const now=new Date();
  for(let i=0;i<60;i++){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const key=d.toLocaleDateString('en-CA');
    const checked=DAILY_ITEMS.some(item=>S.checklist[key+'_d_'+item.k]);
    if(checked)streak++;
    else if(i>0)break; // allow today to not be done yet
  }
  return streak;
}

      </div>`).join('')}
  </div>`;
}

  const sessionLabel=sessionD?fmtDate(sessionD):'Not started yet';

  return`

        </div>
      </div>
      ${day.sections.map((s,si)=>`
        <div class="section-lbl">${s.name}</div>
        ${s.items.map((item,ii)=>{

                ${d2?`<div onclick="event.stopPropagation();">

              </div>
            </div>
          </div>`;
        }).join('')}`).join('')}`}`;
}
// All meals stored by date key — works across the whole week
let activeMealDay = today(); // date string 'YYYY-MM-DD'

function getMealDayKey(date, suffix){ return date + '_m_' + suffix; }
function getDayMeals(date){ return S.mealCheck[getMealDayKey(date,'meals')] || []; }
function saveDayMeals(date, meals){ S.mealCheck[getMealDayKey(date,'meals')] = meals; save(); }

function getWeekDates(){
  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - ((now.getDay()+6)%7));
  return Array.from({length:7},(_,i)=>{
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate()+i);
    return d.toLocaleDateString('en-CA');
  });
}

function getDayTotals(date){
  const meals = getDayMeals(date);
  return meals.reduce((t,m)=>({
    cal:   t.cal   + (m.cal||0),
    protein: t.protein + (m.protein||0),
    carbs: t.carbs + (m.carbs||0),
    fat:   t.fat   + (m.fat||0),
  }), {cal:0,protein:0,carbs:0,fat:0});
}

function addMealToDay(date){
  const name    = document.getElementById('nm-name').value.trim() || 'Meal';
  const cal     = parseInt(document.getElementById('nm-cal').value)     || 0;
  const protein = parseInt(document.getElementById('nm-pro').value)     || 0;
  const carbs   = parseInt(document.getElementById('nm-carb').value)    || 0;
  const fat     = parseInt(document.getElementById('nm-fat').value)     || 0;
  const meals   = getDayMeals(date);
  meals.push({id:Date.now(), name, cal, protein, carbs, fat});
  saveDayMeals(date, meals);
  showMealForm=false; searchResults=[];
  renderContent();
}
function addFavDirectly(favId, date){
  const fav = getFavorites().find(f=>f.id===favId);
  if(!fav) return;
  const meals = getDayMeals(date);
  meals.push({id:Date.now(), name:fav.name, cal:fav.cal, protein:fav.protein, carbs:fav.carbs, fat:fav.fat});
  saveDayMeals(date, meals);
  showMealForm=false;
  renderContent();
}
function addPrepDirectly(name, cal, protein, carbs, fat, date){
  const meals = getDayMeals(date);
  meals.push({id:Date.now(), name, cal, protein, carbs, fat});
  saveDayMeals(date, meals);
  showMealForm=false;
  renderContent();
}

function deleteMealFromDay(date, id){
  const meals = getDayMeals(date).filter(m=>m.id!==id);
  saveDayMeals(date, meals);
  renderContent();
}

function getFavorites(){ return S.mealCheck['favorites'] || []; }
function saveFavoriteFromForm(){
  const name    = document.getElementById('nm-name').value.trim() || 'Meal';
  const cal     = parseInt(document.getElementById('nm-cal').value)  || 0;
  const protein = parseInt(document.getElementById('nm-pro').value)  || 0;
  const carbs   = parseInt(document.getElementById('nm-carb').value) || 0;
  const fat     = parseInt(document.getElementById('nm-fat').value)  || 0;
  const favs = getFavorites();
  if(favs.find(f=>f.name===name)) return; // no dupes
  favs.push({id:Date.now(), name, cal, protein, carbs, fat});
  S.mealCheck['favorites'] = favs;
  save(); renderContent();
}
function deleteFavorite(id){
  S.mealCheck['favorites'] = getFavorites().filter(f=>f.id!==id);
  save(); renderContent();
}
function fillFormFromFav(f){
  document.getElementById('nm-name').value  = f.name;
  document.getElementById('nm-cal').value   = f.cal;
  document.getElementById('nm-pro').value   = f.protein;
  document.getElementById('nm-carb').value  = f.carbs;
  document.getElementById('nm-fat').value   = f.fat;
}
function fillFormFromFavId(id){
  const f = getFavorites().find(f=>f.id===id);
  if(f) fillFormFromFav(f);
}

let searchResults = [];
let searchQuery   = '';

function searchFood(){
  const q = (document.getElementById('food-search')||{}).value||'';
  searchQuery = q.trim().toLowerCase();
  if(!searchQuery){ searchResults=[]; renderContent(); return; }
  const words = searchQuery.split(' ').filter(w=>w.length>1);
  searchResults = FOOD_DB
    .map(f=>{
      const n = f.name.toLowerCase();
      const exactMatch = n.includes(searchQuery) ? 3 : 0;
      const wordMatches = words.filter(w=>n.includes(w)).length;
      return {...f, score: exactMatch + wordMatches};
    })
    .filter(f=>f.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,7);
  renderContent();
}

function fillFromSearch(i){
  const r = searchResults[i];
  if(!r) return;
  document.getElementById('nm-name').value  = r.name;
  document.getElementById('nm-cal').value   = r.cal;
  document.getElementById('nm-pro').value   = r.protein;
  document.getElementById('nm-carb').value  = r.carbs;
  document.getElementById('nm-fat').value   = r.fat;
  searchResults = [];
  searchQuery   = '';
  renderContent();
}

      <div class="metric"><div class="metric-val amber">${weekAvgCal}</div><div class="metric-lbl">avg cal/day</div></div>
      <div class="metric"><div class="metric-val green">${weekAvgPro}g</div><div class="metric-lbl">avg protein/day</div></div>
    </div>
    <div style="margin-top:10px;">
      ${weekDates.map((date,i)=>{
        const t=getDayTotals(date);
        const pct=Math.min(Math.round(t.cal/1825*100),100);
        const d=new Date(date+'T12:00');
        const isActive=date===activeMealDay;
        return`<div onclick="activeMealDay='${date}';showMealForm=false;renderContent();" style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;">
          <div style="width:28px;font-size:10px;font-family:var(--font-m);color:${isActive?'var(--green)':'var(--text2)'};">${dayNames[i]}</div>
          <div style="flex:1;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:${isActive?'var(--green)':'var(--border3)'};border-radius:3px;transition:width 0.4s;"></div>
          </div>
          <div style="width:52px;text-align:right;font-size:10px;font-family:var(--font-m);color:${t.cal>0?'var(--text2)':'var(--text3)'};">${t.cal>0?t.cal+' cal':'—'}</div>
        </div>`;
      }).join('')}
    </div>
  </div>

  <div style="margin-bottom:6px;font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;font-family:var(--font-m);">Prepped recipes — tap to expand</div>
  ${MEALS.map((m,i)=>`
    <div class="meal-card" style="border-left:3px solid ${m.color};">
      <div class="meal-header" onclick="expandedMeal=expandedMeal===${i}?null:${i};renderContent();">
        <div style="flex:1;">
          <div style="font-size:10px;font-family:var(--font-m);color:var(--text2);">${m.flag} ${m.type} — ${m.day}</div>
          <div style="font-size:13px;font-weight:600;color:var(--text);margin-top:3px;">${m.title}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;">
            <span class="chip" style="background:var(--green-dim);color:var(--green);">${m.cal} cal</span>
            <span class="chip" style="background:var(--amber-dim);color:var(--amber);">${m.protein}g pro</span>
            <span class="chip" style="background:var(--blue-dim);color:var(--blue);">${m.carbs}g carbs</span>
            <span class="chip" style="background:var(--coral-dim);color:var(--coral);">${m.fat}g fat</span>
          </div>
        </div>
        <div style="font-size:18px;color:${m.color};margin-left:10px;">${expandedMeal===i?'▲':'▼'}</div>
      </div>
      ${expandedMeal===i?`
        <div class="meal-body">
          <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;font-family:var(--font-m);margin-bottom:8px;">Ingredients</div>
          ${m.ingredients.map(([name,amt])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;"><span style="color:var(--text2);">${name}</span><span style="color:var(--text);font-family:var(--font-m);">${amt}</span></div>`).join('')}
          <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;font-family:var(--font-m);margin-top:12px;margin-bottom:8px;">Method</div>
          ${m.steps.map((step,si)=>`<div class="step-row"><div class="step-num" style="background:${m.color};">${si+1}</div><div class="step-text">${step}</div></div>`).join('')}
          <div style="margin-top:10px;padding:9px 12px;background:var(--bg4);border-radius:8px;font-size:12px;color:var(--text2);">💡 ${m.tip}</div>
        </div>`:''}
    </div>`).join('')}`;
}

function renderLog(){
  const t=today();
  const entries=[...S.weights.map(w=>({date:w.date,type:'weight',val:w.weight+' lbs'})),...S.macros.map(m=>({date:m.date,type:'macros',val:m.cal+' cal · '+m.protein+'g pro'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
  return`
  <div class="page-header">
    <div class="page-title">DAILY<span>LOG</span></div>
    <div class="page-sub"><span class="glow-dot"></span>${t}</div>
  </div>
  <div class="card">
    <div class="card-title">Log weight</div>
    <div class="form-row">
      <div class="form-group"><label>Date</label><input type="date" id="w-date" value="${t}"></div>
      <div class="form-group"><label>Weight (lbs)</label><input type="number" id="w-weight" placeholder="144.0" step="0.1"></div>
    </div>
    <div class="form-group"><label>Notes (optional)</label><input type="text" id="w-notes" placeholder="e.g. morning, post-workout…"></div>
    <button class="btn btn-green" onclick="logWeight()">Save weight entry</button>
  </div>
  <div class="card">
    <div class="card-title">Log macros</div>
    <div class="form-row">
      <div class="form-group"><label>Date</label><input type="date" id="m-date" value="${t}"></div>
      <div class="form-group"><label>Calories</label><input type="number" id="m-cal" placeholder="1825"></div>
    </div>
    <div class="form-row three">
      <div class="form-group"><label>Protein (g)</label><input type="number" id="m-protein" placeholder="165"></div>
      <div class="form-group"><label>Carbs (g)</label><input type="number" id="m-carbs" placeholder="180"></div>
      <div class="form-group"><label>Fat (g)</label><input type="number" id="m-fat" placeholder="55"></div>
    </div>
    <div class="form-group"><label>Meal prep followed?</label>
      <select id="m-prep"><option value="yes">✅ Yes — on plan</option><option value="partial">⚠️ Partial</option><option value="no">❌ Off plan</option></select>
    </div>
    <button class="btn btn-green" onclick="logMacros()">Save macro entry</button>
  </div>
  <div class="card">
    <div class="card-title">Recent entries</div>
    ${entries.length===0?'<div class="empty">No logs yet — start above!</div>'
      :`<table class="log-table"><thead><tr><th>Date</th><th>Type</th><th>Value</th></tr></thead><tbody>
        ${entries.map(l=>`<tr><td>${fmtDate(l.date)}</td><td><span class="badge ${l.type==='weight'?'badge-green':'badge-amber'}">${l.type}</span></td><td style="color:var(--text2);">${l.val}</td></tr>`).join('')}
      </tbody></table>`}
  </div>`;
}

function logWeight(){
  const date=document.getElementById('w-date').value;
  const weight=parseFloat(document.getElementById('w-weight').value);
  const notes=document.getElementById('w-notes').value;
  if(!date||isNaN(weight))return alert('Please enter date and weight.');
  S.weights=S.weights.filter(w=>w.date!==date);
  S.weights.push({date,weight,notes});
  S.weights.sort((a,b)=>a.date.localeCompare(b.date));
  save();renderContent();
}
function logMacros(){
  const date=document.getElementById('m-date').value;
  const cal=parseInt(document.getElementById('m-cal').value)||0;
  const protein=parseInt(document.getElementById('m-protein').value)||0;
  const carbs=parseInt(document.getElementById('m-carbs').value)||0;
  const fat=parseInt(document.getElementById('m-fat').value)||0;
  const prep=document.getElementById('m-prep').value;
  if(!date)return alert('Please enter a date.');
  S.macros=S.macros.filter(m=>m.date!==date);
  S.macros.push({date,cal,protein,carbs,fat,prep});
  S.macros.sort((a,b)=>a.date.localeCompare(b.date));
  save();renderContent();
}

let wChart,mChart;
function renderProgress(){
  const latest=S.weights.length?S.weights[S.weights.length-1].weight:144;
  const lost=+(144-latest).toFixed(1);
  const toGoal=+(latest-137.5).toFixed(1);
  const pct=Math.min(Math.max(Math.round(lost/6.5*100),0),100);
  const weeksLeft=Math.max(Math.ceil(toGoal/0.75),0);
  const bmi=+(latest/2.205/(1.60*1.60)).toFixed(1);
  const avgProtein=S.macros.length?Math.round(S.macros.slice(-7).reduce((s,m)=>s+m.protein,0)/Math.min(S.macros.length,7)):0;
  const avgCal=S.macros.length?Math.round(S.macros.slice(-7).reduce((s,m)=>s+m.cal,0)/Math.min(S.macros.length,7)):0;
  const onPlanDays=S.macros.filter(m=>m.prep==='yes').length;
  return`
  <div class="page-header">
    <div class="page-title">PROG<span>RESS</span></div>
    <div class="page-sub"><span class="glow-dot"></span>144 lbs → 135–140 lbs goal</div>
  </div>
  <div class="card">
    <div class="card-title">Weight goal tracker</div>
    <div class="prog-wrap">
      <div class="prog-top"><span>${latest} lbs → 137.5 lbs target</span><span>${pct}%</span></div>
      <div class="prog-bg"><div class="prog-fill" style="width:${pct}%;"></div></div>
    </div>
    <div class="metric-grid mg-4" style="margin-bottom:0;">
      <div class="metric"><div class="metric-val green">${Math.max(lost,0)}</div><div class="metric-lbl">lbs lost</div></div>
      <div class="metric"><div class="metric-val amber">${Math.max(toGoal,0)}</div><div class="metric-lbl">lbs to go</div></div>
      <div class="metric"><div class="metric-val">${weeksLeft}</div><div class="metric-lbl">est. wks</div></div>
      <div class="metric"><div class="metric-val coral">${bmi}</div><div class="metric-lbl">BMI now</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Stats overview</div>
    <div class="plan-row"><span class="plan-label">Starting weight</span><span>144 lbs</span></div>
    <div class="plan-row"><span class="plan-label">Current weight</span><span style="color:var(--green);">${latest} lbs</span></div>
    <div class="plan-row"><span class="plan-label">Goal range</span><span>135–140 lbs</span></div>
    <div class="plan-row"><span class="plan-label">BMI (Asian scale, >23 overweight)</span><span style="color:${bmi>23?'var(--amber)':'var(--green)'};">${bmi}</span></div>
    <div class="plan-row"><span class="plan-label">Calorie target</span><span>1,825/day</span></div>
    <div class="plan-row"><span class="plan-label">On-plan days logged</span><span style="color:var(--green);">${onPlanDays}</span></div>
  </div>
  ${S.macros.length>0?`<div class="card">
    <div class="card-title">Macro averages — last 7 days</div>
    <div class="metric-grid mg-3" style="margin-bottom:0;">
      <div class="metric"><div class="metric-val amber">${avgProtein}g</div><div class="metric-lbl">avg protein</div></div>
      <div class="metric"><div class="metric-val">${avgCal}</div><div class="metric-lbl">avg calories</div></div>
      <div class="metric"><div class="metric-val green">${onPlanDays}</div><div class="metric-lbl">on-plan days</div></div>
    </div>
  </div>`:''}
  <div class="card">
    <div class="card-title">Weight trend</div>
    ${S.weights.length===0?`
      <div class="empty-state">
        <div class="empty-state-icon">⚖️</div>
        <div class="empty-state-title">No weigh-ins yet</div>
        <div class="empty-state-sub">Log your morning weight daily to see your trend line here.</div>
        <button onclick="openQuickLog('weight')" class="btn btn-green" style="width:auto;padding:0 24px;margin:0 auto;">Log weight now</button>
      </div>`:`<canvas id="weightChart"></canvas>`}
  </div>
  <div class="card">
    <div class="card-title">Macro tracking — last 7 entries</div>
    ${S.macros.length===0?`
      <div class="empty-state">
        <div class="empty-state-icon">🍽</div>
        <div class="empty-state-title">No macros logged</div>
        <div class="empty-state-sub">Log your daily calories and protein to track your nutrition here.</div>
        <button onclick="openQuickLog('macros')" class="btn btn-green" style="width:auto;padding:0 24px;margin:0 auto;">Log macros now</button>
      </div>`:`
      <canvas id="macroChart"></canvas>
      <div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;">
        ${[['var(--amber)','Protein'],['var(--blue)','Carbs'],['var(--coral)','Fat']].map(([c,l])=>`<span style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2);font-family:var(--font-m);"><span style="width:8px;height:8px;border-radius:2px;background:${c};display:inline-block;"></span>${l}</span>`).join('')}
      </div>`}
  </div>`;
}

function initCharts(){
  Chart.defaults.color='#555550';Chart.defaults.borderColor='#1E1E1E';
  const wCtx=document.getElementById('weightChart');
  const mCtx=document.getElementById('macroChart');
  if(wCtx&&S.weights.length>0){
    if(wChart)wChart.destroy();
    wChart=new Chart(wCtx,{type:'line',data:{labels:S.weights.map(w=>fmtDate(w.date)),datasets:[
      {label:'Weight',data:S.weights.map(w=>w.weight),borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.07)',tension:0.4,pointRadius:4,pointBackgroundColor:'#1D9E75',fill:true,borderWidth:2},
      {label:'Goal',data:S.weights.map(()=>137.5),borderColor:'#EF9F27',borderDash:[4,4],pointRadius:0,borderWidth:1.5}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:130,max:150,grid:{color:'#161616'}},x:{grid:{display:false},ticks:{maxRotation:45,autoSkip:true,font:{size:10}}}}}});
  }
  if(mCtx&&S.macros.length>0){
    if(mChart)mChart.destroy();
    const recent=S.macros.slice(-7);
    mChart=new Chart(mCtx,{type:'bar',data:{labels:recent.map(m=>fmtDate(m.date)),datasets:[
      {label:'Protein',data:recent.map(m=>m.protein),backgroundColor:'rgba(239,159,39,0.8)'},
      {label:'Carbs',data:recent.map(m=>m.carbs),backgroundColor:'rgba(74,158,219,0.7)'},
      {label:'Fat',data:recent.map(m=>m.fat),backgroundColor:'rgba(216,90,48,0.7)'},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#161616'},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:10}}}}}});
  }
}

function renderCoach(){
  return`
  <div class="page-header">
    <div class="page-title">AI<span>COACH</span></div>
    <div class="page-sub"><span class="glow-dot"></span>Powered by Claude · Your personal coach</div>
  </div>
  <div class="card">
    <div class="card-title">Quick questions</div>
    ${[['📊','Summarize my progress this week'],['🥗','Are my macros on track?'],['💪','Workout consistency check'],['🎯','When will I hit my goal weight?'],['⚡','What should I focus on today?'],['🍱','Meal prep tips for Sunday']].map(([icon,label])=>`
      <button class="ai-btn" onclick="askAI('${label}')">
        <div class="ai-icon"><span style="font-size:14px;">${icon}</span></div>
        ${label}<span style="margin-left:auto;color:var(--text3);">→</span>
      </button>`).join('')}
  </div>
  <div class="card">
    <div class="card-title" style="margin-bottom:8px;">Ask anything</div>
    <div class="form-group"><input type="text" id="ai-custom" placeholder="e.g. Should I eat more on leg day?"></div>
    <button class="btn btn-ai" onclick="askCustom()" style="margin-top:8px;">Ask coach</button>
  </div>
  <div id="ai-card" style="display:none;" class="card">
    <div class="card-title" id="ai-title">Coach says</div>
    <div class="ai-response" id="ai-response"></div>
  </div>`;
}

function buildContext(){
  const latest=S.weights.length?S.weights[S.weights.length-1].weight:144;
  const wS=S.weights.length?S.weights.slice(-7).map(w=>`${w.date}:${w.weight}lbs`).join(', '):'No weight logged yet.';
  const mS=S.macros.length?S.macros.slice(-5).map(m=>`${m.date}:${m.cal}cal,${m.protein}g protein,prep=${m.prep}`).join(' | '):'No macros logged yet.';
  const workoutDays=DAYS.filter((_,i)=>allDone(i)).map(d=>d.label).join(',')||'None recorded';
  const mealsToday=MEAL_SLOTS.filter(s=>getSlotChoice(s.k)).map(s=>{const c=getSlotChoice(s.k);if(c==='custom'){const d=getCustomData(s.k);return d?d.name:s.label;}const o=s.options.find(o=>o.id===c);return o?o.name:s.label;}).join(', ')||'None yet';
  return`You are a knowledgeable, direct, and encouraging personal coach. User: 32yr Asian male, started 144lbs, goal 135-140lbs, 5'3", BMI 25.5. Plan: 1,825 cal/day (~500 cal deficit), 165g protein/180g carbs/55g fat. 5-day push/pull/legs split + cardio. Meal prep: steak bowl, curry chicken, teriyaki salmon, chipotle turkey, yogurt bark, egg muffins. Current weight: ${latest}lbs. Weight log: ${wS}. Macro log: ${mS}. Completed workouts this week: ${workoutDays}. Meals eaten today: ${mealsToday}. Be specific, practical, and motivating. Under 120 words unless more detail is genuinely needed.`;
}

async function askAI(question){showAI(question);await callAI(question);}
async function askCustom(){const q=document.getElementById('ai-custom').value.trim();if(!q)return;showAI(q);await callAI(q);}
function showAI(title){
  const card=document.getElementById('ai-card');
  if(!card)return;
  card.style.display='block';
  document.getElementById('ai-title').textContent=title;
  document.getElementById('ai-response').innerHTML='<span class="typing-dots" style="color:var(--text2);font-size:18px;"><span>•</span><span>•</span><span>•</span></span>';
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function callAI(question){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:buildContext(),messages:[{role:'user',content:question}]})});
    const data=await r.json();
    const resp=document.getElementById('ai-response');
    if(resp)resp.textContent=data.content?.find(b=>b.type==='text')?.text||'No response received.';
  }catch(e){
    const resp=document.getElementById('ai-response');
    if(resp)resp.textContent='Could not connect to coach. Please try again.';
  }
}

renderNav();renderContent();
</script>
</body>
</html>
